<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Affiliate AI Mobile</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,"Noto Sans Thai",sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:15px;
    color:#111;
}

.container{
    max-width:650px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:18px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

h1{
    font-size:27px;
    margin:5px 0 10px;
}

.subtitle{
    font-size:18px;
    margin-bottom:15px;
}

input[type=file]{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fafafa;
}

#preview{
    display:none;
    width:100%;
    max-height:600px;
    object-fit:contain;
    margin-top:15px;
    border-radius:12px;
    background:#eee;
}

button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:12px;
    background:#ff4b4b;
    color:#fff;
    font-size:19px;
    font-weight:bold;
    margin-top:12px;
    cursor:pointer;
}

button:disabled{
    background:#aaa;
}

.copyBtn{
    background:#222;
}

#status{
    font-size:18px;
    margin-top:15px;
    font-weight:bold;
}

.resultBox{
    background:#f3f3f3;
    padding:18px;
    border-radius:15px;
    margin-top:15px;
}

.sectionTitle{
    font-size:23px;
    font-weight:bold;
    margin-bottom:15px;
}

.info{
    font-size:19px;
    line-height:1.7;
}

.price{
    font-size:30px;
    font-weight:bold;
    color:#e51c3e;
}

.hook{
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    border-left:5px solid #ff4b4b;
    font-size:19px;
    line-height:1.6;
}

.script{
    background:#fff;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    font-size:18px;
    line-height:1.7;
    white-space:pre-wrap;
}

.raw{
    margin-top:20px;
}

.raw textarea{
    width:100%;
    min-height:180px;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

.loading{
    text-align:center;
    padding:15px;
}

</style>
</head>

<body>

<div class="container">

<h1>📷 Affiliate AI Mobile</h1>

<div class="subtitle">
เลือกภาพสินค้าจากมือถือ
</div>

<input
    type="file"
    id="imageInput"
    accept="image/*"
>

<img id="preview">

<button
    id="readBtn"
    onclick="readImage()"
>
🔍 อ่านข้อมูลจากภาพ
</button>

<div id="status"></div>

<div id="result"></div>

</div>

<script>

/* =========================================================
   GLOBAL
========================================================= */

let lastResultText = "";


/* =========================================================
   IMAGE PREVIEW
========================================================= */

document.getElementById("imageInput").addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    const preview = document.getElementById("preview");

    preview.src = URL.createObjectURL(file);

    preview.style.display = "block";

});


/* =========================================================
   CLEAN OCR TEXT
========================================================= */

function cleanOCR(text){

    if(!text){
        return "";
    }

    let t = text;

    // แปลงอักขระที่ OCR มักอ่านผิด
    t = t.replace(/฿/g,"฿");
    t = t.replace(/,/g,",");
    t = t.replace(/\r/g,"");

    // ลบช่องว่างซ้ำ
    t = t.replace(/[ \t]+/g," ");

    // ลบบรรทัดว่างจำนวนมาก
    t = t.replace(/\n{3,}/g,"\n\n");

    return t.trim();
}


/* =========================================================
   NORMALIZE PRICE
========================================================= */

function normalizePrice(value){

    if(!value){
        return null;
    }

    let v = value
        .replace(/[^\d.,]/g,"")
        .replace(/,/g,"");

    const num = parseFloat(v);

    if(!isFinite(num)){
        return null;
    }

    return num;
}


/* =========================================================
   FIND MAIN PRODUCT PRICE
========================================================= */

function findMainPrice(text){

    const candidates = [];

    /*
       รูปแบบที่ต้องการ เช่น

       ฿2,151
       ฿2151
       ฿2,151.00
       2,151 บาท
       ราคา 2,151
    */

    const patterns = [

        /฿\s*([\d,]+(?:\.\d{1,2})?)/gi,

        /([\d,]+(?:\.\d{1,2})?)\s*บาท/gi,

        /ราคา\s*[:：]?\s*฿?\s*([\d,]+(?:\.\d{1,2})?)/gi,

        /ซื้อโดยใช้โค้ด\s*฿?\s*([\d,]+(?:\.\d{1,2})?)/gi

    ];

    patterns.forEach(function(regex){

        let match;

        while((match = regex.exec(text)) !== null){

            const price = normalizePrice(match[1]);

            if(price !== null){

                candidates.push({
                    price:price,
                    text:match[0]
                });

            }

        }

    });


    /*
       ตัดราคาที่ไม่น่าใช่ราคาสินค้า
    */

    const filtered = candidates.filter(function(item){

        const p = item.price;

        // ราคาต่ำกว่า 20 มักเป็น OCR ผิด
        if(p < 20){
            return false;
        }

        // ราคาสูงผิดปกติ
        if(p > 1000000){
            return false;
        }

        return true;

    });


    if(filtered.length === 0){
        return null;
    }


    /*
       ให้คะแนนราคา

       ราคาที่มี ฿ จะได้คะแนนสูงสุด
       ราคาที่อยู่ใกล้คำว่า "ราคา" ได้คะแนนเพิ่ม
       ราคาที่เป็นทศนิยมแบบ 194.15 มักเป็นค่างวด
    */

    const scored = filtered.map(function(item){

        let score = 0;

        if(item.text.includes("฿")){
            score += 100;
        }

        if(item.text.includes("บาท")){
            score += 50;
        }

        if(item.text.includes("ราคา")){
            score += 60;
        }

        if(item.price >= 100){
            score += 20;
        }

        /*
           ราคาทศนิยม เช่น 194.15
           มักเป็นค่างวด ไม่ใช่ราคาหลัก
        */

        if(item.price % 1 !== 0){
            score -= 20;
        }

        /*
           ราคาหลักมักอยู่หลักร้อย-หลักแสน
        */

        if(item.price >= 500){
            score += 10;
        }

        return {
            ...item,
            score:score
        };

    });


    scored.sort(function(a,b){

        if(b.score !== a.score){
            return b.score - a.score;
        }

        return b.price - a.price;

    });


    return scored[0].price;

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(price){

    if(price === null){
        return "ไม่พบราคา";
    }

    return "฿" + price.toLocaleString("th-TH",{
        minimumFractionDigits:0,
        maximumFractionDigits:2
    });

}


/* =========================================================
   FIND PRODUCT NAME
========================================================= */

function findProductName(text){

    const lines = text
        .split("\n")
        .map(x => x.trim())
        .filter(x => x.length > 2);


    const badWords = [

        "PAYDAY",
        "SPayLater",
        "ShopeeVIP",
        "ส่วนลด",
        "ส่งฟรี",
        "ซื้อโดยใช้โค้ด",
        "ขายแล้ว",
        "ตัวเลือกสินค้า",
        "8 ตัวเลือกสินค้า",
        "เก็บแล้ว",
        "บาท",
        "ราคา",
        "รวม"

    ];


    /*
       หา line ที่ดูเหมือนชื่อสินค้า
    */

    for(let line of lines){

        let lower = line.toLowerCase();

        let bad = false;

        for(let word of badWords){

            if(lower.includes(word.toLowerCase())){

                bad = true;
                break;

            }

        }

        if(bad){
            continue;
        }


        // ต้องมีความยาวพอสมควร
        if(line.length < 8){
            continue;
        }


        // ถ้าเป็นตัวเลขล้วนไม่เอา
        if(/^[\d\s.,฿]+$/.test(line)){
            continue;
        }


        /*
           ชื่อสินค้ามักมีตัวอักษรไทย/อังกฤษ
        */

        if(/[ก-๙A-Za-z]/.test(line)){

            return line
                .replace(/\s+/g," ")
                .trim();

        }

    }


    return "ไม่สามารถระบุชื่อสินค้าได้";

}


/* =========================================================
   FIND PRODUCT FEATURES
========================================================= */

function findFeatures(text){

    const features = [];

    const keywords = [

        "4G",
        "5G",
        "2K",
        "4K",
        "HD",
        "Ultra HD",
        "Solar",
        "360 องศา",
        "ไร้สาย",
        "ไม่ต้องเติมเงิน",
        "ไม่ต้องใช้ไฟ",
        "ไม่ต้องใช้ WiFi",
        "WiFi",
        "ฟรี",
        "ส่งฟรี",
        "รับประกัน",
        "AI",
        "กันน้ำ",
        "กลางคืน",
        "สีในตัว"

    ];


    keywords.forEach(function(keyword){

        const regex = new RegExp(
            keyword.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),
            "i"
        );

        if(regex.test(text)){

            if(!features.includes(keyword)){

                features.push(keyword);

            }

        }

    });


    return features;

}


/* =========================================================
   GENERATE HOOK
========================================================= */

function generateHooks(name,price,features){

    const featureText =
        features.length > 0
        ? features.slice(0,4).join(", ")
        : "ฟังก์ชันครบ ใช้งานสะดวก";


    return [

        `ใครกำลังหากล้องดี ๆ ราคาไม่แรง ตัวนี้น่าสนใจมาก เพราะมี ${featureText}`,

        `เห็นราคาแล้วต้องบอกเลยว่าตัวนี้น่าสนใจ โดยเฉพาะคนที่กำลังมองหา ${name}`,

        `ไม่ต้องเดินสายให้ยุ่งยาก ตัวนี้มี ${featureText} อยู่ในตัว`,

        `ถ้ากำลังหากล้องไว้ดูบ้าน ดูร้าน หรือดูพื้นที่ ตัวนี้ลองดูเลย`,

        `จุดเด่นของตัวนี้คือ ${featureText} ใครกำลังหาอยู่ลองดูตัวนี้ครับ`

    ];

}


/* =========================================================
   GENERATE VIDEO SCRIPT
========================================================= */

function generateScript(name,price,features){

    const featureText =
        features.length > 0
        ? features.slice(0,5).join(" / ")
        : "ใช้งานง่ายและสะดวก";


    return `ใครกำลังมองหา ${name}

ตัวนี้น่าสนใจมากครับ

จุดเด่นคือ ${featureText}

เหมาะสำหรับคนที่อยากได้อุปกรณ์ไว้ใช้งานแบบสะดวก ๆ

ส่วนราคาที่อ่านได้จากภาพคือ ${formatPrice(price)}

ถ้าใครสนใจ ลองกดเข้าไปดูรายละเอียดและเช็กราคาปัจจุบันก่อนตัดสินใจได้เลยครับ`;

}


/* =========================================================
   ANALYZE
========================================================= */

function analyzeProduct(text){

    const cleanText = cleanOCR(text);

    const price = findMainPrice(cleanText);

    const name = findProductName(cleanText);

    const features = findFeatures(cleanText);

    const hooks = generateHooks(
        name,
        price,
        features
    );

    const script = generateScript(
        name,
        price,
        features
    );


    return {

        name:name,

        price:price,

        features:features,

        hooks:hooks,

        script:script,

        raw:cleanText

    };

}


/* =========================================================
   DISPLAY RESULT
========================================================= */

function displayResult(data){

    const result = document.getElementById("result");

    let featureText =
        data.features.length > 0
        ? data.features.join(", ")
        : "ไม่พบข้อมูล";


    let hooksHTML = "";

    data.hooks.forEach(function(hook,index){

        hooksHTML += `
            <div class="hook">
                <b>Hook ${index + 1}</b><br>
                ${hook}
            </div>
        `;

    });


    result.innerHTML = `

        <div class="resultBox">

            <div class="sectionTitle">
                🛍️ ข้อมูลสินค้า
            </div>

            <div class="info">

                <b>ชื่อสินค้า:</b><br>
                ${escapeHTML(data.name)}

                <br><br>

                <b>ราคา:</b><br>

                <span class="price">
                    ${formatPrice(data.price)}
                </span>

                <br><br>

                <b>จุดเด่น:</b><br>
                ${escapeHTML(featureText)}

            </div>

        </div>


        <div class="resultBox">

            <div class="sectionTitle">
                🎯 Hook ขายสินค้า
            </div>

            ${hooksHTML}

        </div>


        <div class="resultBox">

            <div class="sectionTitle">
                🎬 สคริปต์วิดีโอ
            </div>

            <div class="script">
                ${escapeHTML(data.script)}
            </div>

            <button
                class="copyBtn"
                onclick="copyScript()"
            >
                📋 คัดลอกสคริปต์
            </button>

        </div>


        <div class="raw">

            <details>

                <summary>
                    🔎 ดูข้อความ OCR ที่อ่านได้
                </summary>

                <br>

                <textarea readonly>${escapeHTML(data.raw)}</textarea>

            </details>

        </div>

    `;


    lastResultText = data.script;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    if(!text){
        return "";
    }

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   COPY SCRIPT
========================================================= */

async function copyScript(){

    if(!lastResultText){
        return;
    }

    try{

        await navigator.clipboard.writeText(lastResultText);

        alert("✅ คัดลอกสคริปต์แล้ว");

    }catch(error){

        alert("ไม่สามารถคัดลอกอัตโนมัติได้");

    }

}


/* =========================================================
   OCR
========================================================= */

async function readImage(){

    const input =
        document.getElementById("imageInput");

    const result =
        document.getElementById("result");

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("readBtn");


    if(!input.files.length){

        alert("กรุณาเลือกรูปก่อน");

        return;

    }


    const file = input.files[0];


    result.innerHTML = "";

    status.innerHTML =
        "⏳ กำลังเตรียมอ่านภาพ...";

    button.disabled = true;


    try{

        /*
           สร้าง Worker
        */

        const worker =
            await Tesseract.createWorker(
                "tha+eng"
            );


        status.innerHTML =
            "⏳ กำลังอ่านข้อมูลจากภาพ...";


        const {data} =
            await worker.recognize(file);


        await worker.terminate();


        const ocrText =
            data.text || "";


        if(!ocrText.trim()){

            status.innerHTML =
                "❌ ไม่พบข้อความในภาพ";

            button.disabled = false;

            return;

        }


        status.innerHTML =
            "⏳ กำลังวิเคราะห์ข้อมูลสินค้า...";


        /*
           วิเคราะห์
        */

        const product =
            analyzeProduct(ocrText);


        displayResult(product);


        status.innerHTML =
            "✅ วิเคราะห์สินค้าเสร็จแล้ว";


    }catch(error){

        console.error(error);

        status.innerHTML =
            "❌ เกิดข้อผิดพลาด";

        result.innerHTML = `

            <div class="resultBox">

                <b>รายละเอียดข้อผิดพลาด</b>

                <br><br>

                ${escapeHTML(error.message)}

            </div>

        `;

    }


    button.disabled = false;

}

</script>

</body>
</html>
