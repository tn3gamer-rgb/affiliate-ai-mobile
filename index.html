<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate AI Mobile</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}
.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:16px;
}
h1{
    font-size:24px;
}
button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#ff4b4b;
    color:white;
    font-size:18px;
    margin-top:10px;
}
input{
    width:100%;
    margin:15px 0;
}
#preview{
    max-width:100%;
    margin-top:15px;
    border-radius:10px;
}
#result{
    white-space:pre-wrap;
    background:#f1f1f1;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
    min-height:100px;
}
</style>
</head>

<body>

<div class="container">

<h1>📷 Affiliate AI Mobile</h1>

<p>เลือกรูปสินค้าจากมือถือ</p>

<input type="file" id="imageInput" accept="image/*">

<img id="preview">

<button onclick="readImage()">🔍 อ่านข้อมูลจากภาพ</button>

<div id="status"></div>

<div id="result"></div>

</div>

<script>

async function readImage(){

    const input = document.getElementById("imageInput");
    const result = document.getElementById("result");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    if(!input.files.length){
        alert("กรุณาเลือกรูปก่อน");
        return;
    }

    const file = input.files[0];

    preview.src = URL.createObjectURL(file);

    result.innerText = "";
    status.innerText = "⏳ กำลังอ่านข้อมูลจากภาพ...";

    try{

        const worker = await Tesseract.createWorker("tha+eng");

        const { data } = await worker.recognize(file);

        result.innerText = data.text;

        status.innerText = "✅ อ่านข้อมูลสำเร็จ";

        await worker.terminate();

    }catch(error){

        status.innerText = "❌ เกิดข้อผิดพลาด";
        result.innerText = error.message;

    }

}

</script>

</body>
</html>
