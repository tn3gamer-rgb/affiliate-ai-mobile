<style>

<body>

<div class="container">

<h1>📷 Affiliate AI Mobile</h1>

<p>เลือกรูปสินค้าจากมือถือ</p>

<input
    type="file"
    id="imageInput"

>

<img id="preview">

<button
    id="readBtn"
    onclick="readImage()"
>
🔍 อ่านข้อมูลจากภาพ
</button>

<div id="status"></div>


<div id="analysis" class="hidden">


    <!-- ข้อมูลสินค้า -->

</div>


<!-- OCR -->

<div class="box">

    <div class="resultTitle">
        📝 ข้อความที่อ่านจากภาพ
    </div>

    <div id="ocrResult"></div>

</div>

<script>


let finalScript = "";



/* =====================================================
   เลือกรูป
===================================================== */

document
.getElementById("imageInput")
.addEventListener("change",function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    const preview =
        document.getElementById("preview");

    preview.src =
        URL.createObjectURL(file);

    preview.style.display = "block";

    document
    .getElementById("analysis")
    .classList.add("hidden");

    document
    .getElementById("ocrResult")
    .innerText = "";

    document
    .getElementById("status")
    .innerText = "";

});



/* =====================================================
   โหลดรูป
===================================================== */

function loadImage(file){

    return new Promise(function(resolve,reject){

        const img = new Image();

        img.onload = function(){
            resolve(img);
        };

        img.onerror = reject;

        img.src =
            URL.createObjectURL(file);

    });

}



/* =====================================================
   สร้าง Canvas สำหรับ OCR
===================================================== */

function createCanvas(img,enhanced=false){

    const maxWidth = 2200;

    let scale =
        maxWidth / img.naturalWidth;

    if(scale > 2){
        scale = 2;
    }

    if(scale < 1){
        scale = 1;
    }

    const width =
        Math.round(img.naturalWidth * scale);

    const height =
        Math.round(img.naturalHeight * scale);


    const canvas =
        document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    /*
        เพิ่มความชัดสำหรับ OCR
    */

    if(enhanced){

        const imageData =
            ctx.getImageData(
                0,
                0,
                width,
                height
            );

        const data =
            imageData.data;


        for(
            let i=0;
            i<data.length;
            i+=4
        ){

            let gray =
                0.299 * data[i] +
                0.587 * data[i+1] +
                0.114 * data[i+2];


            /*
                เพิ่ม contrast
            */

            gray =
                ((gray - 128) * 1.6) + 128;


            gray =
                Math.max(
                    0,
                    Math.min(
                        255,
                        gray
                    )
                );


            data[i] =
                gray;

            data[i+1] =
                gray;

            data[i+2] =
                gray;

        }


        ctx.putImageData(
            imageData,
            0,
            0
        );

    }


    return canvas;

}



/* =====================================================
   OCR
===================================================== */

async function runOCR(worker,canvas){

    const result =
        await worker.recognize(canvas);

    return result.data.text || "";

}



/* =====================================================
   อ่านภาพ
===================================================== */

async function readImage(){

    const input =
        document.getElementById(
            "imageInput"
        );

    const status =
        document.getElementById(
            "status"
        );

    const result =
        document.getElementById(
            "ocrResult"
        );

    const analysis =
        document.getElementById(
            "analysis"
        );

    const button =
        document.getElementById(
            "readBtn"
        );


    if(!input.files.length){

        alert(
            "กรุณาเลือกรูปสินค้าก่อน"
        );

        return;

    }


    button.disabled = true;

    button.innerText =
        "⏳ กำลังอ่านภาพ...";


    analysis
    .classList
    .add("hidden");


    result.innerText = "";


    try{


        status.innerText =
            "⏳ กำลังเตรียมภาพ...";


        const img =
            await loadImage(
                input.files[0]
            );


        /*
            OCR รอบที่ 1
        */

        const normalCanvas =
            createCanvas(
                img,
                false
            );


        /*
            OCR รอบที่ 2
            เพิ่มความชัด
        */

        const enhancedCanvas =
            createCanvas(
                img,
                true
            );


        status.innerText =
            "⏳ กำลังอ่านภาษาไทยและตัวเลข...";


        const worker =
            await Tesseract.createWorker(
                "tha+eng"
            );


        const textNormal =
            await runOCR(
                worker,
                normalCanvas
            );


        const textEnhanced =
            await runOCR(
                worker,
                enhancedCanvas
            );


        await worker.terminate();


        /*
            รวม OCR
        */

        const combinedText =
            textNormal +
            "\n" +
            textEnhanced;


        result.innerText =
            combinedText;


        status.innerText =
            "⏳ กำลังวิเคราะห์สินค้าและตรวจสอบราคา...";


        analyzeProduct(
            combinedText
        );


        analysis
        .classList
        .remove("hidden");


        status.innerText =
            "✅ วิเคราะห์สินค้าเสร็จแล้ว";


    }
    catch(error){

        status.innerText =
            "❌ เกิดข้อผิดพลาด";

        result.innerText =
            error.message ||
            String(error);

    }


    button.disabled = false;

    button.innerText =
        "🔍 อ่านข้อมูลจากภาพ";

}



/* =====================================================
   ทำความสะอาด OCR
===================================================== */

function cleanOCR(text){

    return text

    .replace(/\r/g,"")

    .replace(/\u00A0/g," ")

    .replace(/[¦]/g," ")

    .replace(/[ \t]+/g," ")

    .replace(/\n{2,}/g,"\n")

    .trim();

}



/* =====================================================
   แปลงตัวเลข OCR ที่มักอ่านผิด
===================================================== */

function fixOCRNumber(value){

    return value

    .replace(/O/g,"0")
    .replace(/o/g,"0")

    .replace(/I/g,"1")
    .replace(/l/g,"1")

    .replace(/\|/g,"1")

    .replace(/S/g,"5")

    .replace(/B(?=\d)/g,"8");

}



/* =====================================================
   ดึงตัวเลข
===================================================== */

function numberValue(value){

    value =
        fixOCRNumber(value);

    value =
        value
        .replace(/,/g,"")
        .replace(/[^\d.]/g,"");


    const n =
        parseFloat(value);


    if(
        !Number.isFinite(n)
    ){

        return null;

    }


    return n;

}



/* =====================================================
   ตรวจราคาสินค้า
===================================================== */

function extractPrice(text){

    const lines =
        text
        .split("\n")
        .map(
            x => x.trim()
        )
        .filter(Boolean);


    let candidates = [];


    /*
        ------------------------------------------------
        PRIORITY 1

        ตัวเลขที่ติดกับ ฿
        เช่น

        ฿2,151
        ฿ 2,151
        ฿2151
        ------------------------------------------------
    */


    const bahtRegex =
        /฿\s*([0-9OoIl|,\.]+)/gi;


    for(
        const line of lines
    ){

        let match;


        while(
            (match =
                bahtRegex.exec(line))
            !== null
        ){

            const value =
                numberValue(
                    match[1]
                );


            if(
                value === null ||
                value < 10 ||
                value > 100000
            ){
                continue;
            }


            let score = 100;


            /*
                ราคาใกล้ข้อความ "ราคา"
            */

            if(
                /ราคา|ซื้อโดยใช้โค้ด|ราคาหลังโค้ด/i
                .test(line)
            ){

                score += 100;

            }


            /*
                ถ้าเป็นส่วนลด / ลดสูงสุด
                ห้ามเอาเป็นราคาหลัก
            */

            if(
                /ลดสูงสุด|ขั้นต่ำ|ส่วนลด|ลดราคา|SPayLater/i
                .test(line)
            ){

                score -= 100;

            }


            candidates.push({

                value:value,

                score:score,

                line:line

            });

        }

    }



    /*
        ------------------------------------------------
        PRIORITY 2

        ราคา xxx บาท
        ------------------------------------------------
    */


    const bahtTextRegex =
        /([0-9OoIl|,\.]+)\s*บาท/gi;


    for(
        const line of lines
    ){

        let match;


        while(
            (match =
                bahtTextRegex.exec(line))
            !== null
        ){

            const value =
                numberValue(
                    match[1]
                );


            if(
                value === null ||
                value < 10 ||
                value > 100000
            ){
                continue;
            }


            let score = 80;


            if(
                /ราคา|ราคาหลังโค้ด|ซื้อโดยใช้โค้ด/i
                .test(line)
            ){

                score += 100;

            }


            if(
                /ลดสูงสุด|ขั้นต่ำ|ส่วนลด|SPayLater/i
                .test(line)
            ){

                score -= 100;

            }


            candidates.push({

                value:value,

                score:score,

                line:line

            });

        }

    }



    /*
        ------------------------------------------------
        PRIORITY 3

        ราคาหลังโค้ด 2,151

        หรือ

        ราคา 2,151
        ------------------------------------------------
    */


    const priceTextRegex =
        /(?:ราคาหลังโค้ด|ราคาหลังโค้ดส่วนลด|ราคา|ซื้อโดยใช้โค้ด)[^\d]{0,20}([0-9OoIl|,\.]+)/gi;


    for(
        const line of lines
    ){

        let match;


        while(
            (match =
                priceTextRegex.exec(line))
            !== null
        ){

            const value =
                numberValue(
                    match[1]
                );


            if(
                value === null ||
                value < 10 ||
                value > 100000
            ){
                continue;
            }


            let score = 120;


            if(
                /ราคาหลังโค้ด/i
                .test(line)
            ){

                score += 100;

            }


            if(
                /ลดสูงสุด|ขั้นต่ำ|ส่วนลด|SPayLater/i
                .test(line)
            ){

                score -= 100;

            }


            candidates.push({

                value:value,

                score:score,

                line:line

            });

        }

    }



    /*
        ------------------------------------------------
        ตัดตัวเลขที่ไม่ใช่ราคาสินค้า
        ------------------------------------------------
    */

    candidates =
        candidates.filter(
            item => {

                const line =
                    item.line;


                if(
                    /ลดสูงสุด/i.test(line)
                ){

                    return false;

                }


                if(
                    /ขั้นต่ำ/i.test(line)
                ){

                    return false;

                }


                if(
                    /SPayLater/i.test(line)
                ){

                    return false;

                }


                return true;

            }
        );



    if(
        !candidates.length
    ){

        return "";

    }



    /*
        เลือกคะแนนสูงสุด
    */

    candidates.sort(
        (a,b) =>
            b.score - a.score
    );


    const price =
        candidates[0].value;


    return (
        "฿" +
        price.toLocaleString(
            "en-US",
            {
                maximumFractionDigits:2
            }
        )
    );

}



/* =====================================================
   หาชื่อสินค้า
===================================================== */

function findProductName(text){

    const lines =
        text
        .split("\n")
        .map(
            x => x.trim()
        )
        .filter(
            x => x.length > 8
        );


    const ignore = [

        "PAYDAY",
        "SPayLater",
        "ShopeeVIP",
        "ส่วนลด",
        "ราคาหลังโค้ด",
        "ซื้อโดยใช้โค้ด",
        "ขายแล้ว",
        "ตัวเลือกสินค้า",
        "8 ตัวเลือกสินค้า",
        "ส่งฟรี",
        "เก็บแล้ว",
        "ขั้นต่ำ",
        "ลดสูงสุด"

    ];


    const productWords =
        /กล้อง|กล้องวงจรปิด|มือถือ|โทรศัพท์|เสื้อ|กางเกง|รองเท้า|กระเป๋า|คีย์บอร์ด|เมาส์|หูฟัง|พัดลม|เครื่อง|สาย|ชาร์จ|แบตเตอรี่|สินค้า/i;


    for(
        const line of lines
    ){

        if(
            ignore.some(
                word =>
                    line.includes(word)
            )
        ){

            continue;

        }


        if(
            productWords.test(line)
        ){

            return line
            .replace(
                /\s+/g,
                " "
            )
            .trim();

        }

    }


    /*
        ถ้าไม่เจอชื่อสินค้า
        พยายามเอาบรรทัดที่ยาวที่สุด
    */

    let longest = "";


    for(
        const line of lines
    ){

        if(
            line.length > longest.length &&
            !/PAYDAY|ส่วนลด|SPayLater/i.test(line)
        ){

            longest = line;

        }

    }


    return longest;

}



/* =====================================================
   จุดเด่นสินค้า
===================================================== */

function findFeatures(text){

    const keywords = [

        "4G",
        "5G",
        "2K",
        "4K",
        "HD",
        "Ultra HD",
        "WiFi",
        "Wi-Fi",
        "ไม่ต้องใช้ WiFi",
        "ไม่ต้องเติมเงิน",
        "ไม่ต้องใช้ไฟ",
        "ไร้สาย",
        "Solar",
        "โซล่า",
        "โซลาร์เซลล์",
        "ชาร์จเร็ว",
        "กันน้ำ",
        "หมุน 360 องศา",
        "360 องศา",
        "รับประกัน",
        "ฟรี",
        "ส่งฟรี"

    ];


    const features = [];


    keywords.forEach(
        keyword => {

            if(
                text
                .toLowerCase()
                .includes(
                    keyword.toLowerCase()
                )
            ){

                if(
                    !features.includes(
                        keyword
                    )
                ){

                    features.push(
                        keyword
                    );

                }

            }

        }
    );


    return features;

}



/* =====================================================
   ยอดขาย
===================================================== */

function findSold(text){

    const match =
        text.match(
            /ขายแล้ว\s*[0-9OoIl|,]+\+?\s*ชิ้น/i
        );


    if(match){

        return match[0];

    }


    return "";

}



/* =====================================================
   วิเคราะห์สินค้า
===================================================== */

function analyzeProduct(text){

    const clean =
        cleanOCR(text);


    const product =
        findProductName(
            clean
        );


    const price =
        extractPrice(
            clean
        );


    const features =
        findFeatures(
            clean
        );


    const sold =
        findSold(
            clean
        );



    let info = "";


    info +=
        "ชื่อสินค้า: " +
        (
            product ||
            "ตรวจไม่พบ"
        ) +
        "\n\n";


    info +=
        "ราคา: ";


    if(price){

        info +=
            '<span class="price">' +
            price +
            "</span>";

    }
    else{

        info +=
            "ตรวจไม่พบ";

    }


    info +=
        "\n\n";


    info +=
        "จุดเด่น: " +
        (
            features.length
            ?
            features.join(", ")
            :
            "ตรวจไม่พบ"
        ) +
        "\n\n";


    info +=
        "ยอดขาย: " +
        (
            sold ||
            "ไม่พบข้อมูล"
        );


    document
    .getElementById(
        "productInfo"
    )
    .innerHTML = info;



    createHooks(
        product,
        price,
        features
    );


    createScript(
        product,
        price,
        features
    );

}



/* =====================================================
   สร้าง Hook
===================================================== */

function createHooks(
    product,
    price,
    features
){

    const mainFeature =
        features.length
        ?
        features[0]
        :
        "ใช้งานง่าย";


    const hooks = [

        "ใครกำลังหาของดีราคาคุ้ม ต้องดูตัวนี้",

        "ตัวนี้เห็นราคาแล้วน่าสนใจมาก",

        "ของชิ้นนี้ฟังก์ชันเยอะกว่าที่คิด",

        "ถ้าใครกำลังหา " +
        mainFeature +
        " ตัวนี้น่าสนใจ",

        "เจอของดีแบบนี้ เลยอยากเอามาบอกต่อ",

        "ใครกำลังตัดสินใจซื้อ ลองดูตัวนี้ก่อน",

        "ตัวนี้เหมาะกับคนที่อยากได้ของครบในชิ้นเดียว",

        "ฟังก์ชันแบบนี้ ไม่คิดว่าจะมาอยู่ในราคานี้",

        "ใครกำลังมองหาของใช้แบบนี้ ห้ามเลื่อนผ่าน",

        "ตัวนี้เป็นอีกตัวที่น่าจับตามองมาก"

    ];


    const container =
        document.getElementById(
            "hooks"
        );


    container.innerHTML = "";


    hooks.forEach(
        function(hook,index){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "hook";


            div.innerText =
                (index + 1) +
                ". " +
                hook;


            container.appendChild(
                div
            );

        }
    );

}



/* =====================================================
   สร้าง Script 20 วินาที
===================================================== */

function createScript(
    product,
    price,
    features
){

    let featureText =
        features.length
        ?
        features
        .slice(0,3)
        .join(", ")
        :
        "ฟังก์ชันครบ ใช้งานสะดวก";


    let priceText =
        price ||
        "เช็กราคาที่หน้าสินค้า";


    finalScript =
`ใครกำลังมองหาของดีราคาคุ้ม ตัวนี้น่าสนใจมาก

จุดเด่นคือ ${featureText}

ใช้งานสะดวก และเหมาะกับคนที่กำลังมองหาของแบบนี้

ตอนนี้ราคา ${priceText}

ใครสนใจ กดดูรายละเอียดที่ตะกร้าได้เลย`;


    document
    .getElementById(
        "scriptResult"
    )
    .innerText =
        finalScript;

}



/* =====================================================
   Copy Script
===================================================== */

async function copyScript(){

    try{

        await navigator.clipboard.writeText(
            finalScript
        );


        alert(
            "✅ คัดลอกสคริปต์แล้ว"
        );

    }
    catch(error){

        alert(
            "❌ คัดลอกไม่สำเร็จ"
        );

    }

}

</script>
